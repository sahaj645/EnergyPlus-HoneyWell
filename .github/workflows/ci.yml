name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    name: ruff + pytest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # EnergyPlus is NOT installed in CI. `pyenergyplus` is unavailable here by
      # design: nothing imported by the test suite may require the runtime API.
      - name: Lint
        run: ruff check .

      # Capped Hypothesis profile (tests/conftest.py): the adversarial guardian properties run
      # 25 examples here instead of the 500 a local `dev`-profile run uses, so CI stays fast and
      # non-flaky. Coverage gate is deliberately scoped to guardian/ + common/ only - the safety
      # kernel and the shared contracts - not chased anywhere else (rest of the pipeline needs
      # EnergyPlus/Ollama to exercise meaningfully, which CI does not have).
      - name: Test (with coverage gate on guardian/ + common/)
        env:
          HIVE_HYPOTHESIS_PROFILE: ci
        run: |
          pytest -q --cov=guardian --cov=common --cov-report=term-missing --cov-fail-under=80
